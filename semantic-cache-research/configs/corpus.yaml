# Corpus construction configuration.
# This file is the authoritative machine-readable source for corpus parameters.
# The root corpus_spec.md documents the methodology and achieved counts.
# A runner must reject null model ids/versions rather than silently selecting defaults.
# corpus_config.py enforces at load time that judge family differs from generator family.

corpus:
  source:
    dataset: nq_open
    repository: google-research-datasets/nq_open
    revision: 5dd9790a83002ad084ddeb7c420dc716852c6f28   # immutable; do not change
    splits: [train, validation]
    question_field: question
    answers_field: answer
    raw_path: data/raw/

  seed: 42

  sampling:
    anchors: 100
    dev_anchors: 50
    held_out_questions_minimum: 1000
    unrelated_queries: 100

  filtering:
    minimum_question_tokens: 5
    maximum_question_tokens: 20
    tokenizer: unicode_word_tokens_lowercase_v1
    deduplication_token_jaccard_threshold: 0.8
    unrelated_maximum_token_jaccard_to_any_anchor: 0.2
    dominant_token_max_fraction: 0.5

  paraphrases:
    per_anchor: 4
    levels: [P1, P2, P3, P4]
    style_examples_minimum: 5
    style_examples_maximum: 8
    minimum_length_ratio: 0.5
    maximum_length_ratio: 2.0
    preserve_anchor_numbers_and_years: true
    maximum_retries: 3

  hard_negatives:
    types: [E, N, T, S]
    # NOT_APPLICABLE responses from the generator are allowed and do not count
    # toward the quota; the pipeline iterates anchors until each type's quota is
    # filled or the anchor pool is exhausted.
    not_applicable_allowed: true
    quota_per_type: 50

  cache_responses:
    provider: ollama
    model: llama3.2:3b
    temperature: 0

  audit:
    samples_per_stratum: 10
    strata: [P1, P2, P3, P4, E, N, T, S, unrelated]
    match_configuration: minilm_cosine
    # Retained for compatibility with scripts/audit_corpus.py. This is not an
    # acceptance gate in the main threshold experiment.
    minimum_cohen_kappa: 0.60
    # Diagnostic used when interpreting the audit; below-threshold strata in
    # the current corpus were reported and retained, not regenerated.
    regeneration_accuracy_threshold: 0.9
    confidence_interval: wilson_95

  models:
    generator:
      provider: ollama
      id: gemma3:4b
      family: gemma
      temperature: 0
    fallback:
      provider: ollama
      id: llama3.2:3b
      family: llama
      temperature: 0
    judge:
      provider: ollama
      id: phi4-mini
      family: phi
      temperature: 0
      # corpus_config.py enforces at load: judge.family != generator.family.
      # Raising here (not deferred to a stage check) prevents misconfigured
      # runs from silently producing biased quality assessments.

  embeddings:
    primary:
      provider: sentence_transformers
      id: sentence-transformers/all-MiniLM-L6-v2
    secondary:
      provider: sentence_transformers
      id: BAAI/bge-base-en-v1.5

  reranker:
    provider: sentence_transformers
    id: cross-encoder/quora-distilroberta-base
