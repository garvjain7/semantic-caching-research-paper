# embedding_comparison.yaml
#
# Retained secondary-experiment config. The active run_experiments.py already
# includes MiniLM and BGE in its four-configuration threshold sweep, so this
# file does not define a separate completed run or result directory.

experiment_name: embedding_comparison
embedding_models:
  - sentence-transformers/all-MiniLM-L6-v2
  - BAAI/bge-base-en-v1.5
threshold_range:
  start: 0.50
  end: 0.95
  step: 0.05
dataset_path: data/processed/
llm_model: llama3.2:3b
